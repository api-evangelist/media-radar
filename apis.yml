apis:
- name: MediaRadar Client API
  description: >-
    The MediaRadar Client API delivers MediaRadar brand, contacts and advertising
    data to existing clients over REST. It is fronted by Azure API Management and
    documented through the MediaRadar Client API Portal, which is gated behind client
    sign-in. Integrations authenticate with a per-client API Key presented as an APIM
    subscription-key request header. No OpenAPI, Swagger, GraphQL or AsyncAPI
    contract is published on any MediaRadar-controlled host, and the portal exposes
    zero APIs and zero products to anonymous visitors, so operation paths, schemas
    and quotas are not publicly readable.
  humanURL: https://api-portal.mediaradar.com/
  baseURL: https://api.mediaradar.com
  tags:
  - Advertising Intelligence
  - Marketing Intelligence
  - Competitive Intelligence
