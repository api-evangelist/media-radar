aid: media-radar
name: Media Radar
description: >-
  MediaRadar (now incorporating the data and capabilities of Vivvix) is a
  marketing and advertising intelligence platform that tracks advertising
  investment, creative, and brand activity across streaming and linear TV,
  digital and programmatic, social, retail media, out-of-home, radio, podcast,
  and print. It serves brands, agencies, publishers, platforms, and
  consultancies with competitive, commercial, creative, market, and political
  ad intelligence used to inform mission-critical marketing and sales decisions.
  MediaRadar delivers its data through a web UX, data feeds, and a client REST
  API. The MediaRadar Client API Portal is a private Azure API Management
  developer portal gated behind client sign-in; API endpoints and schemas are
  not published publicly, and integrations authenticate with a per-client API
  Key. This profile was surfaced as a portfolio company of Bain Capital Ventures
  and enriched by the API Evangelist pipeline.
