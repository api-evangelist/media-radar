  x-base-url-evidence: >-
    https://api.mediaradar.com was confirmed live on 2026-08-12 as an Azure API
    Management gateway: an anonymous request to the host root returns APIM's own
    envelope '{ "statusCode": 404, "message": "Resource not found" }', and
    /internal-status-0123456789abcdef returns 200 with
    {"Message":"Service operational","Region":"East US 2","SkuType":"Premium"}. The
    developer portal's /config.json names the same APIM service
    (managementApiUrl .../service/mediaradar). Operation paths under this base are
    not published; the host is recorded, the surface is not.
